version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      # The Riverpod packages have to move together: riverpod_generator pins
      # riverpod_analyzer_utils, which fixes the analyzer and riverpod_lint versions.
      riverpod:
        patterns:
          - "riverpod*"
          - "flutter_riverpod"
          - "hooks_riverpod"
      flutter-dependencies:
        patterns:
          - "*"
    ignore:
      # google_fonts 9.x does not compile against Flutter's ThemeData text theme.
      # See https://github.com/almaz-uno/ilovlya-ui/issues/177 (Upgrade google_fonts to 9.x).
      - dependency-name: "google_fonts"
        versions: [">=9.0.0"]
      # media_kit_video comes from a fork with a Linux fix (dependency_overrides);
      # an update from pub.dev would drop that fix.
      - dependency-name: "media_kit_video"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
