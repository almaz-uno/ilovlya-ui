name: Flatpak

# Builds the Linux Flatpak of a published release and attaches it to that
# release, beside the APK. The recipe is linux/flatpak/uno.almaz.ilovlya.yml; it
# has to build with the Flutter that .fvmrc pins, which is checked first. A run
# can be repeated by hand for a release whose bundle is missing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach, e.g. v3.7.2'
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Flatpak
    uses: ./.github/workflows/flatpak-build.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}

  attach:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch the bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle

      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "ilovlya-$TAG.flatpak" --clobber --repo "$GITHUB_REPOSITORY"
