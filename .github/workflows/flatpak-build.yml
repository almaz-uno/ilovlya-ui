name: Flatpak build

# Shared recipe for release bundles and conditional pull request validation.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag; omitted for a pull request build without publication'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  FLATPAK_ID: uno.almaz.ilovlya
  TAG: ${{ inputs.tag || github.sha }}
  BRANCH: master

jobs:
  build:
    name: Build the bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Check the recipe's Flutter against .fvmrc
        run: |
          set -eu
          pinned=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)
          if ! grep -q "flutter_linux_${pinned}-stable.tar.xz" linux/flatpak/uno.almaz.ilovlya.yml; then
            echo "::error file=linux/flatpak/uno.almaz.ilovlya.yml::the recipe does not build with Flutter ${pinned}, which .fvmrc pins"
            exit 1
          fi

      - name: Install the runtime and SDKs
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.llvm20//25.08

      # The flathub-infra image comes without a machine-id and without FUSE in the container; its own action makes the
      # one and builds without rofiles-fuse, and so does this.
      - name: Build
        run: |
          dbus-uuidgen --ensure=/etc/machine-id
          flatpak-builder --force-clean --user --disable-rofiles-fuse --default-branch="$BRANCH" \
            flatpak-build linux/flatpak/uno.almaz.ilovlya.yml

      - name: Bundle
        run: |
          flatpak build-export repo "flatpak-build" "$BRANCH"
          flatpak build-bundle repo "ilovlya-${TAG}.flatpak" "$FLATPAK_ID" "$BRANCH"

      # Kept for the release job, and for a pull request so that its bundle can be installed and tried.
      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: ilovlya-${{ env.TAG }}.flatpak
          retention-days: ${{ inputs.tag != '' && 7 || 3 }}
