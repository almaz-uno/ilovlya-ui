name: Flatpak build

# Shared recipe for release bundles and conditional pull request validation.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag; omitted for a pull request build without publication'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  FLATPAK_ID: uno.almaz.ilovlya
  TAG: ${{ inputs.tag || github.sha }}
  BRANCH: master

jobs:
  build:
    name: Build the bundle
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Check the recipe's Flutter against .fvmrc
        run: |
          set -eu
          pinned=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)
          if ! grep -q "flutter_linux_${pinned}-stable.tar.xz" linux/flatpak/uno.almaz.ilovlya.yml; then
            echo "::error file=linux/flatpak/uno.almaz.ilovlya.yml::the recipe does not build with Flutter ${pinned}, which .fvmrc pins"
            exit 1
          fi

      - name: Install the runtime and SDKs
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.llvm19//24.08

      - name: Build
        run: |
          flatpak-builder --force-clean --user --default-branch="$BRANCH" \
            flatpak-build linux/flatpak/uno.almaz.ilovlya.yml

      - name: Bundle
        run: |
          flatpak build-export repo "flatpak-build" "$BRANCH"
          flatpak build-bundle repo "ilovlya-${TAG}.flatpak" "$FLATPAK_ID" "$BRANCH"

      - name: Keep the bundle for the release job
        if: inputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: ilovlya-${{ env.TAG }}.flatpak
          retention-days: 7
