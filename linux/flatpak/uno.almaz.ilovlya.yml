# The Flatpak of ilovlya, built by .github/workflows/flatpak.yml for every published release and attached to it.
# Every release is built on branch master, given as --default-branch, so that a new bundle replaces the installed one
# instead of installing beside it. Flutter is the one .fvmrc pins; the workflow checks it.
# Locally, from the repository's root:
#   flatpak-builder --force-clean --default-branch=master flatpak-build linux/flatpak/uno.almaz.ilovlya.yml
app-id: uno.almaz.ilovlya
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ilovlya
appstream-compose: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
finish-args:
  - --device=all
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
  - --filesystem=/tmp
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  # D-Bus access for screen lock inhibition
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  # NetworkManager on the system bus, which connectivity_plus asks through background_downloader
  - --system-talk-name=org.freedesktop.NetworkManager
  - --env=LD_LIBRARY_PATH=/app/lib
  # GDK_GL is set here for `flatpak info` and anything else that reads the metadata, and again in /app/bin/ilovlya below,
  # which is what takes effect. No EGL vendor or Vulkan ICD list here: the runtime's GL extension picks the driver,
  # NVIDIA's included (#141).
  - --env=GDK_GL=gles
modules:
  - name: ilovlya
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      arch:
        x86_64:
          env:
            BUNDLE_PATH: /run/build/ilovlya/build/linux/x64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/ilovlya/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/ilovlya/.pub-cache

    build-commands:
      - flutter pub get
      - flutter build linux --release
      #- ls -la "${BUNDLE_PATH}/lib"
      # - pwd
      - install -d "${FLATPAK_DEST}/lib"
      - cp -r ${BUNDLE_PATH}/lib/* "${FLATPAK_DEST}/lib/"
      - install -d "${FLATPAK_DEST}/data"
      - cp -r ${BUNDLE_PATH}/data/* "${FLATPAK_DEST}/data/"
      - install -Dm755 "${BUNDLE_PATH}/ilovlya" "${FLATPAK_DEST}/ilovlya"
      - install -d "${FLATPAK_DEST}/bin"
      # The launcher sets GDK_GL itself: the environment it execs with wins over `flatpak override`, and an override left
      # from older builds with GDK_GL=disable gives GDK no GL context, which leaves the whole window black.
      - |
        cat > "${FLATPAK_DEST}/bin/ilovlya" << 'EOF'
        #!/bin/sh
        export GDK_GL=gles
        exec /app/ilovlya "$@"
        EOF
      - chmod +x "${FLATPAK_DEST}/bin/ilovlya"
      - install -Dm644 linux/${FLATPAK_ID}.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm644 assets/images/${FLATPAK_ID}.svg "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg"
      # Generate metainfo with version from pubspec.yaml
      - |
        VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
        DATE=$(date +%Y-%m-%d)
        sed -e "s/__VERSION__/${VERSION}/g" -e "s/__DATE__/${DATE}/g" \
          linux/${FLATPAK_ID}.metainfo.xml.template > linux/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 linux/${FLATPAK_ID}.metainfo.xml "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"

    sources:
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.7-stable.tar.xz
        sha256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
        dest: flutter
      - type: dir
        path: ../..
        skip:
          - .git
          - .dart_tool
          - build
          - flatpak-build
          - .flatpak-builder
    modules:
      - name: libshaderc
        buildsystem: cmake-ninja
        builddir: true
        build-options:
          build-args:
            - --share=network
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DSHADERC_SKIP_TESTS=ON
          - -DSHADERC_SKIP_EXAMPLES=ON
          - -DSHADERC_SKIP_COPYRIGHT_CHECK=ON
        cleanup:
          - /bin
          - /include
          - /lib/pkgconfig
          - /lib/*.a
          - /lib64/*.a
          - /lib64/cmake
        post-install:
          - install -Dm755 libshaderc/libshaderc_shared.so.1 ${FLATPAK_DEST}/lib/libshaderc_shared.so.1
        sources:
          - type: git
            url: https://github.com/google/shaderc.git
            tag: v2024.3
          - type: shell
            commands:
              - ./utils/git-sync-deps
      # mpv 0.36 aborts at start on 25.08 (`ta_dbg_check_header: Assertion 'h->canary == CANARY' failed`, #139);
      # 0.40 is built with meson, and needs libplacebo. 0.40 asks for FFmpeg 6.1 at least, which is the one below.
      - name: libmpv
        cleanup:
          - /include
          - /lib/pkgconfig
          - /lib/*.a
          - /lib/debug
        buildsystem: meson
        config-opts:
          - --buildtype=release
          - -Dlibmpv=true
          - -Dgl=enabled
          - -Dlua=luajit
          - -Dlibarchive=enabled
          - -Dalsa=disabled
          - -Dmanpage-build=disabled
          - -Dhtml-build=disabled
          - -Dpdf-build=disabled
          - -Dwerror=false
        sources:
          - type: git
            url: https://github.com/mpv-player/mpv.git
            tag: v0.40.0
            commit: e48ac7ce08462f5e33af6ef9deeac6fa87eef01e
        modules:
          # As in Flathub's io.mpv.Mpv on 25.08; shaderc is the module above.
          - name: libplacebo
            buildsystem: meson
            config-opts:
              - --buildtype=release
              - -Dvulkan=enabled
              - -Dshaderc=enabled
              - -Ddemos=false
              - -Dtests=false
            cleanup:
              - /include
              - /lib/pkgconfig
            sources:
              - type: git
                url: https://github.com/haasn/libplacebo.git
                tag: v7.351.0
                commit: 3188549fba13bbdf3a5a98de2a38c2e71f04e21e
          - name: luajit
            no-autogen: true
            cleanup:
              - /bin
              - /include
              - /lib/pkgconfig
              - /share/man
            sources:
              - type: git
                url: https://github.com/LuaJIT/LuaJIT.git
                disable-shallow-clone: true
                commit: eec7a8016c3381b949b5d84583800d05897fa960
                x-checker-data:
                  type: json
                  url: https://api.github.com/repos/LuaJIT/LuaJIT/branches/v2.1
                  commit-query: .commit.sha
                  version-query: .commit.sha
                  timestamp-query: .commit.commit.committer.date
              - type: shell
                commands:
                  - sed -i 's|/usr/local|/app|' ./Makefile
          - name: libass
            cleanup:
              - /include
              - /lib/*.la
              - /lib/pkgconfig
            config-opts:
              - --disable-static
            sources:
              - type: archive
                url: https://github.com/libass/libass/releases/download/0.17.1/libass-0.17.1.tar.gz
                sha256: d653be97198a0543c69111122173c41a99e0b91426f9e17f06a858982c2fb03d
            modules:
              - name: fribidi
                cleanup:
                  - /bin
                  - /include
                  - /lib/pkgconfig
                  - /lib/*.la
                  - /share/man
                buildsystem: meson
                config-opts:
                  - --buildtype=release
                  - -Ddocs=false
                sources:
                  - type: git
                    url: https://github.com/fribidi/fribidi.git
                    tag: v1.0.12
                    commit: 6428d8469e536bcbb6e12c7b79ba6659371c435a
          # Decoding only: the player encodes nothing, and FFmpeg's own decoders read H.264, HEVC, MPEG-4, MP3 and AAC;
          # the encoder libraries (x264, x265, Xvid, LAME, FDK AAC) are left out: they only slowed the build down.
          - name: ffmpeg
            cleanup:
              - /include
              - /lib/pkgconfig
              - /share/ffmpeg/examples
            config-opts:
              - --enable-shared
              - --disable-static
              - --disable-debug
              - --enable-gnutls
              - --disable-doc
              #- --disable-ffplay
              - --enable-gpl
              - --enable-libass
              - --enable-libfribidi
              - --enable-libpulse
              - --enable-libtheora
              - --enable-libvorbis
              - --enable-libvpx
            build-options:
              arch:
                x86_64:
                  config-opts:
                    - --enable-nvdec
            sources:
              - type: archive
                url: https://ffmpeg.org/releases/ffmpeg-6.1.2.tar.xz
                sha256: 3b624649725ecdc565c903ca6643d41f33bd49239922e45c9b1442c63dca4e38
            modules:
              - name: ffnvcodec
                only-arches:
                  - x86_64
                buildsystem: simple
                build-commands:
                  - make
                  - make install PREFIX=${FLATPAK_DEST}
                sources:
                  - type: archive
                    url: https://github.com/FFmpeg/nv-codec-headers/releases/download/n12.1.14.0/nv-codec-headers-12.1.14.0.tar.gz
                    sha256: 62b30ab37e4e9be0d0c5b37b8fee4b094e38e570984d56e1135a6b6c2c164c9f
              - name: libvpx
                config-opts:
                  - --enable-runtime-cpu-detect
                  - --enable-shared
                  - --disable-static
                  - --enable-pic
                  - --disable-install-bins
                  - --disable-install-docs
                  - --disable-install-srcs
                  - --enable-vp8
                  - --enable-postproc
                  - --enable-vp9
                  - --enable-vp9-highbitdepth
                sources:
                  - type: archive
                    url: https://github.com/webmproject/libvpx/archive/refs/tags/v1.13.1.tar.gz
                    sha256: 00dae80465567272abd077f59355f95ac91d7809a2d3006f9ace2637dd429d14
