name: ilovlya
description: Ilovlya Media Center

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 3.9.2

environment:
  sdk: '>=3.0.0 <4.0.0'
  # The oldest Flutter the client builds with: the web image of the server uses
  # 3.44. Development and Codemagic use the version pinned in .fvmrc.
  flutter: ">=3.44.0"

dependencies:
  animated_search_bar: ^2.8.0
  app_links: ^7.2.1
  async: ^2.13.1
  audio_service: ^0.18.19
  audio_video_progress_bar: ^2.0.2
  background_downloader: ^9.5.6
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  fuzzywuzzy: ^1.1.6
  google_fonts: ^8.2.0
  http: ^1.6.0
  intl: any
  json_annotation: ^4.9.0
  logger: ^2.7.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  mobile_scanner: ^7.2.0
  open_filex: ^4.5.0
  package_info_plus: ^10.2.1
  path: ^1.8.3
  path_provider: ^2.1.6
  riverpod_annotation: ^2.2.1
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5
  timeago: ^3.7.0
  universal_platform: ^1.0.0+1
  url_launcher: ^6.3.2
  audio_session: ^0.2.4
  external_path: ^2.2.0
  wheel_chooser: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  riverpod_generator: ^2.3.5
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.2

# media_kit_video 2.0.1 renders video in software on Linux with Flutter 3.38 and later, X11 and XWayland included:
# no EGL context is current on the platform thread (media-kit/media-kit#1404). media-kit/media-kit#1466 fixes it.
# almaz-uno/media-kit is our fork: the branch ilovlya/media_kit_video-2.0.1-pr1466 is the 2.0.1 published on pub.dev
# plus that PR's linux/ changes only, so every other platform builds the published plugin (#153: upstream main moved
# iOS and macOS to SwiftPM, and the plugin was not registered there). Kept alive by the tag pr1466-on-2.0.1-babde3e8.
# Drop this once a release of media_kit_video has the fix.
dependency_overrides:
  media_kit_video:
    git:
      url: https://github.com/almaz-uno/media-kit.git
      ref: babde3e83a5a1ae1a6160a15840cbf2294d4074a
      path: media_kit_video

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/images/icons/
