name: ilovlya
description: Ilovlya Media Center

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 3.6.8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  animated_search_bar: ^2.8.0
  app_links: ^7.0.0
  async: ^2.13.1
  audio_service: ^0.18.18
  audio_video_progress_bar: ^2.0.2
  background_downloader: ^9.5.4
  device_info_plus: ^12.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  fuzzywuzzy: ^1.1.6
  google_fonts: ^8.1.0
  http: ^1.6.0
  intl: any
  json_annotation: ^4.9.0
  logger: ^2.7.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  open_filex: ^4.5.0
  package_info_plus: ^9.0.1
  path: ^1.8.3
  path_provider: ^2.1.2
  riverpod_annotation: ^2.2.1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  timeago: ^3.7.0
  universal_platform: ^1.0.0+1
  url_launcher: ^6.3.2
  audio_session: ^0.2.3
  external_path: ^2.2.0
  wheel_chooser: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  riverpod_generator: ^2.3.5
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.2

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/images/icons/
